name: Deploy Pages

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'results/latest.json'
      - 'results/bootstrap.json'
      - 'docs/index.md'
      - 'docs/portal.md'
      - '.github/workflows/pages.yml'
      - 'PUBLIC_DISCLOSURE_BOUNDARY.md'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Optional completed public main Envoy run ID; blank uses reviewed snapshot'
        type: string
        required: false
      bootstrap:
        description: 'Publish bootstrap without runtime claims (leave run_id blank)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test publication boundary and rendering
        run: python3 -m unittest discover -s portal -p 'test_*.py' -v
      - name: Select public evidence and build the static portal
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          run_id = os.environ.get('RUN_ID', '').strip()
          bootstrap = os.environ.get('BOOTSTRAP') == 'true'
          if bootstrap and run_id:
              raise SystemExit('Select bootstrap OR a public run, not both')
          source = 'results/bootstrap.json' if bootstrap else 'results/latest.json'
          if run_id:
              if not run_id.isascii() or not run_id.isdigit() or int(run_id) <= 0:
                  raise SystemExit('run_id must be a positive integer')
              source = 'results/selected.json'
              subprocess.run(['python3', 'portal/import_evidence.py', '--run-id', run_id,
                              '--output', source], check=True)
          subprocess.run(['python3', 'portal/build.py', '--input', source], check=True)
          expected = {'index.html', 'style.css', 'result.json', '.nojekyll'}
          if {p.name for p in Path('_site').iterdir()} != expected:
              raise SystemExit('Unexpected publication file')
          PY
      - name: Browser check at desktop and mobile widths
        run: node portal/check_browser.mjs _site
      - name: Upload PR preview (no deployment permissions)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: conformance-portal-preview
          path: |
            _site/
            portal-preview/
          retention-days: 3
      - name: Upload Pages artifact for manual main deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site/
          retention-days: 1

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
