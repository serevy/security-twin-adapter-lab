name: Envoy Conformance

on:
  pull_request:
    paths:
      - 'docker/envoy/**'
      - 'tests/**'
      - 'scripts/**'
      - 'specs/**'
      - 'PUBLIC_DISCLOSURE_BOUNDARY.md'
      - '.github/workflows/envoy-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'docker/envoy/**'
      - 'tests/**'
      - 'scripts/**'
      - 'specs/**'
      - 'PUBLIC_DISCLOSURE_BOUNDARY.md'
      - '.github/workflows/envoy-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Public unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run the same local conformance command
        run: python3 scripts/run_envoy_conformance.py
      - name: Always tear down the range
        if: always()
        run: docker compose -p security-twin-envoy-lab -f docker/envoy/compose.yml down -v --remove-orphans
      - name: Upload bounded public evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: envoy-web-api-conformance
          path: |
            results/envoy-web-api.json
            results/envoy-compose.log
          if-no-files-found: warn
          retention-days: 3
